[package]
name = "gsm7"
description = "GSM-7 (aka GSM 03.38 or 3GPP 23.038) encoding and decoding in Rust"
version = "0.3.0"
authors = ["jbg <jbg@dtmf.io>"]
edition = "2021"
license = "MIT"
readme = "README.md"

[dependencies]
bitstream-io = {version = "4.0.0", no-default-features = true}

# Same as used by bitstream-io
core2 = "0.4"

[features]
default = ["std"]
std = ["bitstream-io/std"]
